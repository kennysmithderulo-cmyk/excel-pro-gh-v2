<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Pro GH - Kenny Murray</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#0f1e3d;color:#fff}
.hero{text-align:center;padding:50px 20px 20px}
.hero h1{font-size:38px;line-height:1.1;font-weight:900}
.hero h1 span{color:#fbbf24}
.hero p{color:#94a3b8;margin-top:15px;max-width:600px;margin-left:auto;margin-right:auto;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;padding:20px;max-width:1200px;margin:0 auto}
.card{background:#1a2d5a;border-radius:18px;overflow:hidden;cursor:pointer;border:1px solid #2a3f6f;transition:.2s;position:relative;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(0.98)}
.card-img{height:210px;background:#0a1430;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.card-body{padding:18px}
.card-body h3{font-size:16px;font-weight:800}
.card-body.sub{color:#fbbf24;font-size:12px;margin:8px 0;font-weight:700}
.card-body.desc{color:#9fb0d0;font-size:12px;line-height:1.5;height:36px;overflow:hidden}
.meta{margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.badge{background:#0f1e3d;border:1px solid #2a3f6f;color:#7aa0d6;padding:5px 10px;border-radius:20px;font-size:10px}
.price{background:#fbbf24;color:#000;padding:8px 16px;border-radius:20px;font-weight:900;font-size:12px}
/* MODAL - NEW */
#modal{position:fixed;inset:0;background:rgba(2,10,30,0.92);backdrop-filter:blur(8px);z-index:99999;display:none;padding:12px;overflow-y:auto}
#modal.open{display:flex;justify-content:center;align-items:flex-start}
.modal-box{background:#fff;color:#0f172a;width:100%;max-width:900px;border-radius:20px;overflow:hidden;margin:20px auto;animation:pop.25s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e2e8f0}
.modal-top h2{font-size:18px;font-weight:900}
.modal-gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;background:#f1f5f9}
.modal-gallery img{width:100%;border-radius:10px;border:1px solid #e2e8f0;background:#fff}
.modal-info{padding:18px}
.btn-wa{display:block;background:#25D366;color:#fff;text-align:center;padding:16px;border-radius:12px;text-decoration:none;font-weight:900;margin-top:14px}
.close-btn{font-size:28px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#f1f5f9}
@media(max-width:600px){.modal-gallery{grid-template-columns:1fr}.hero h1{font-size:32px}}
</style>
</head>
<body>

<div class="hero">
<h1>My Portfolio — <span>7</span><br><span>Best-Selling</span><br>Systems</h1>
<p>Built for Ghana, priced in GHS ₵, offline-ready, no subscription — Premium 2026 Edition. Tap any card to view full screenshots.</p>
</div>

<div class="grid" id="grid"></div>

<!-- ONE CLICK MODAL -->
<div id="modal" onclick="if(event.target.id==='modal') closeModal()">
<div class="modal-box">
<div class="modal-top">
<h2 id="mTitle"></h2>
<div class="close-btn" onclick="closeModal()">×</div>
</div>
<div class="modal-gallery" id="mGallery"></div>
<div class="modal-info">
<p id="mPrice" style="color:#16a34a;font-weight:900;font-size:22px"></p>
<p id="mDesc" style="margin-top:10px;line-height:1.6;color:#334155;font-size:14px"></p>
<a id="mWa" target="_blank" class="btn-wa">💬 Buy This System — WhatsApp</a>
<p style="text-align:center;margin-top:12px;color:#64748b;font-size:12px;cursor:pointer" onclick="closeModal()">✕ Tap outside to close</p>
</div>
</div>
</div>

<script>
// YOUR 7 SYSTEMS - Using your uploaded 16 screenshots
const projects = [
{title:"Data Cleaning Systems",price:"GHS 200",cover:"data-cleaning.png",imgs:["data-cleaning.png","data-cleaning2.png","data-cleaning3.png"],desc:"Turns messy, duplicated data (10,000+ rows) into clean, accurate reports in 1 click. Built with Power Query, TRIM, LOWER, TEXT, removes duplicates automatically. Saves 96% time for Ghanaian businesses."},
{title:"Auto Inventory System",price:"GHS 300",cover:"auto-inventory1.png",imgs:["auto-inventory1.png","auto-inventory2.png"],desc:"Automated inventory with LOWER(TRIM), TEXT(TODAY), IF error-proofing, Pivot + Slicers. 80% faster reporting for shops and SMEs. Offline-ready, no subscription."},
{title:"Leave Tracker System",price:"GHS 250",cover:"leave-tracker.png",imgs:["leave-tracker.png","leave-tracker2.png","leave-tracker3.png"],desc:"Employee leave management — auto calculation of days, TEXT(TODAY), monthly pivot group. HR ready for Ghana companies."},
{title:"Customer Tracker",price:"GHS 200",cover:"customer-tracker.png",imgs:["customer-tracker.png","customer-tracker1.png"],desc:"Manage 1000+ customers, XLOOKUP, payment status, follow-ups. Built for sales teams and agencies."},
{title:"Sales Data Analytics",price:"GHS 250",cover:"sales-data.png",imgs:["sales-data.png","sales-data2.png","sales-data3.png"],desc:"VSTACK, LEFT+TEXT for codes, Monthly grouping, 10% commission calc field, combo charts. Executive dashboard."},
{title:"Sales Portfolio Dashboard",price:"GHS 250",cover:"sales-portfolio.png",imgs:["sales-portfolio.png","sales-portfolio2.png","sales-portfolio3.png"],desc:"Complete sales portfolio with budget vs actual, SUMIF, pie charts, slicers for month/type. CEO-level view."},
{title:"Personal Budget + Sales Suite",price:"GHS 150",cover:"sales-portfolio2.png",imgs:["sales-portfolio2.png","sales-portfolio3.png","sales-data3.png"],desc:"Personal budget + sales tracker combo. Best seller for individuals and small businesses in Ghana."}
];

const grid = document.getElementById('grid');
projects.forEach((p,i)=>{
const el = document.createElement('div');
el.className='card';
el.innerHTML = `
<div class="card-img"><img src="${p.cover}" onerror="this.src='https://via.placeholder.com/600x300/16264e/fbbf24?text=${encodeURIComponent(p.title)}'" alt="${p.title}"></div>
<div class="card-body">
<h3>${p.title}</h3>
<div class="sub">Power Query • Automation • 96% Time Saved</div>
<div class="desc">${p.desc}</div>
<div class="meta">
<div><span class="badge">Excel</span> <span class="badge">Power Query</span></div>
<span class="price">→ ${p.price}</span>
</div>
</div>`;
// THIS MAKES TAP WORK - both click and touch
el.addEventListener('click', ()=> openModal(i));
el.addEventListener('touchend', (e)=> { e.preventDefault(); openModal(i); }, {passive:false});
grid.appendChild(el);
});

function openModal(i){
const p = projects[i];
document.getElementById('mTitle').innerText = p.title;
document.getElementById('mPrice').innerText = p.price;
document.getElementById('mDesc').innerText = p.desc;
document.getElementById('mGallery').innerHTML = p.imgs.map(img=>`<img src="${img}" onerror="this.style.display='none'" alt="">`).join('');
document.getElementById('mWa').href = `https://wa.me/233548097756?text=Hi%20Kenny,%20I%20want%20${encodeURIComponent(p.title)}%20${p.price}%20—%20${encodeURIComponent('https://excelprogh.vercel.app')}`;
document.getElementById('modal').classList.add('open');
document.body.style.overflow='hidden';
}
function closeModal(){
document.getElementById('modal').classList.remove('open');
document.body.style.overflow='auto';
}
</script>
</body>
</html>
